 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./input.css">
    <!-- script of javascript -->
    <script src="./showhide.js" defer></script>
    <script src="./validation.js" defer></script>
    
    <style>
        * {
            margin: auto;
            box-sizing: border-box;
        }

    </style>
</head>

<body class=" w-full h-screen font-poppins">
    <!-- Orb container -->
    <div class="absolute w-screen h-screen overflow-hidden -z-10">

        <!-- Orb 1 -->
        <div class="absolute w-100 h-100 bg-sky-400 rounded-full blur-[80px] opacity-60 -top-25 -left-25"
            style="animation: float 5s ease-in-out infinite alternate;"></div>

        <!-- Orb 2 -->
        <div class="absolute w-125 h-125 bg-indigo-400 rounded-full blur-[80px] opacity-60 -bottom-37.5 -right-25"
            style="animation: float 5s ease-in-out infinite alternate; animation-delay:-1s;"></div>

        <!-- Orb 3 -->
        <div class="absolute w-75 h-75 bg-fuchsia-400 rounded-full blur-[80px] opacity-60 top-[40%] left-[60%]"
            style="animation: float 5s ease-in-out infinite alternate; animation-delay:-1s;"></div>
    </div>
    <!------------------------------->

    <!-- header  part  of  webpage -->

    <!-- the part of log in form  -->
    <div class="container-login max-w-1/2 relative h-[80vh] rounded-[20px] top-10 
         bg-white/3 backdrop-blur-[20px] border border-white/10 border-t-white/20 border-l-white/20
         shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5),inset_0_0_0_1px_rgba(255,255,255,0.05)] flex" id="container-login">

        <div class=" w-1/2 h-full rounded-tl-[20px] rounded-bl-[20px]  flex flex-wrap">
            <div class=" w-full h-auto  font-poppins  text-left [&>span]:text-gray-400 px-10 py-5 " id="title">
                <h1 class="text-3xl font-semibold uppercase text-blue-950 ">welcome  back,<br> Product system</h1>
                <span>Enter your Email to access your Control Panel  Product System...</span>
            </div>

            <button class="absolute flex top-5 left-[87%] cursor-pointer gap-1 text-[20px]  backlogin" id="backlogin">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </button>
            <!-- login-part -->
            <form id="login"
                class=" w-100  login
                px-10   border border-gray-400 rounded-[5px] 
                [&>div>label]:font-medium [&>div>label]:text-[18px] [&>div>label]:text-gray-300 [&>div>input]:outline-none
                [&>.outer-container]:absolute [&>.out-container]:w-full [&>.out-container]:text-center  [&>.out-container]:flex [&>.out-container]:relative">
                <!-- email-login -->
                <div class=" text-2xl text-center py-13 font-bold uppercase" id="login-title">
                    <span>sign in </span>
                </div>
                <!-- input-email-singin -->
                <div class="out-container h-25  [&>input]:z-10 [&>label]:-z-10 [&>i]:z-10">
                    <input type="email" id="email-signin"
                        class="  w-full text-[18px] text-heading bg-transparent border-0 border-b-2  border-b-blue-800 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer"
                        placeholder=" " />
                    <label for="email-login"
                        class="absolute text-sm text-left text-body duration-300 transform -translate-y-6  top-8 scale-75 origin-left peer-focus:s-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:text-blue-950 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Email</label>
                    <i class="fa-solid fa-at absolute top-10 left-[90%] text-xl text-gray-500 "></i>
                    <small class="error " id="email-signin-error"></small>
                </div>
                <!-- input-password-singin -->
                <div class="out-container h-25 [&>input]:z-10 [&>label]:-z-10 [&>i]:z-10 ">
                    <input type="password" id="password-signin" maxlength="20"
                        class=" w-full text-[18px] text-heading bg-transparent border-0 border-b-2 border-b-blue-800 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer  showpassword"
                        placeholder=" " />
                    <label for="password"
                        class="absolute text-[20px] text-body duration-300 transform -translate-y-6 scale-75 top-8 origin-left peer-focus:s-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-focus:text-blue-950 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Password</label>
                    <i class="fa-solid fa-lock absolute top-10 text-xl left-[90%] text-gray-500 cursor-pointer"
                        id="toggle" onclick="sawpassword()"></i>
                    <small class="error" id="password-signin-error"></small>
                </div>
                <button type="submit"
                    class=" border-2 w-full px-2.5 py-2.5 cursor-pointer rounded-2xl font-bold hover:bg-blue-950 hover:text-gray-300  uppercase">
                    sign in
                </button>
                <small id="success-signin"></small>
            </form>
            <div class=" text-center showbtnsingin  py-3.5 px-2.5 bg-mist-200  rounded-2xl">
                <p class="capitalize cursor-none inline">
                    Don't have account /
                </p>
                <button
                    class="btnsingup font-bold cursor-pointer border-none capitalize hover:underline hover:text-blue-600 inline " id ="btnsingup">
                    sign up
                </button>
            </div>

            <!--------------------------------------->
            <!-- sign up part -->
            <form id="singup"
                class=" w-100 h-[50vh] singup 
                    px-10   border border-gray-400 rounded-[5px]
                    [&>div>label]:font-medium [&>div>label]:text-[18px] [&>div>label]:text-gray-300 [&>div>input]:outline-none
                    [&>.outer-container]:absolute [&>.out-container]:w-full  [&>.out-container]:flex [&>.out-container]:relative ">
                <div class=" text-2xl text-center py-5 font-bold uppercase">
                    <span>sign up</span>
                </div>
                <!-- email-input -->
                <div class="out-container h-25 [&>input]:z-10 [&>label]:-z-10 [&>i]:z-10 ">
                    <input type="email" id="email-singup"
                        class="w-full text-[18px] text-heading bg-transparent border-0 border-b-2  border-b-blue-800 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer"
                        placeholder=" " />
                    <label for="email"
                        class=" absolute text-sm text-left text-body duration-300 transform -translate-y-6  top-8 scale-75 origin-left peer-focus:s-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:text-blue-950 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Email</label>
                    <i class="fa-solid fa-at absolute top-10 left-[90%] text-xl text-gray-500"></i>
                    <small class="error" id="email-singup-error"></small>
                </div>
                <!-- password-input -->
                <div class="out-container h-25 [&>input]:z-10 [&>label]:-z-10 [&>i]:z-10 ">
                    <input type="password" id="password-singup" maxlength="20"
                        class=" w-full text-[18px] text-heading bg-transparent border-0 border-b-2 border-b-blue-800 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer  showpassword "
                        placeholder="" />
                    <label for="password"
                        class="absolute text-[20px] text-body duration-300 transform -translate-y-6 scale-75 top-8 origin-left peer-focus:s-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-focus:text-blue-950 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Password</label>
                    <i class="fa-solid fa-lock absolute top-10 left-[90%] text-xl text-gray-500   cursor-pointer"
                        id="toggle" onclick="sawpassword()"></i>
                    <small class="error" id="password-singup-error"></small>
                </div>
                <!-- re-password -->
                <div class="out-container h-25 [&>input]:z-10 [&>label]:-z-10 [&>i]:z-10 ">
                    <input type="password" id="password-Re-singup" maxlength="20"
                        class=" w-full text-[18px] text-heading bg-transparent border-0 border-b-2 border-b-blue-800 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer showpassword"
                        placeholder="" />
                    <label for="password"
                        class="absolute text-[20px] text-body duration-300 transform -translate-y-6 scale-75 top-8 origin-left peer-focus:s-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-focus:text-blue-950 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Re-Password</label>
                    <i class="fa-solid fa-lock absolute top-10 left-[90%] text-xl text-gray-500 cursor-pointer"
                        id="toggle" onclick="sawpassword()"></i>
                    <small class="error" id="password-Re-error"></small>
                </div>

                <button type="submit"
                    class=" border-2 w-full px-2.5 py-2.5 text-center cursor-pointer rounded-2xl font-bold hover:bg-blue-950 hover:text-gray-300  uppercase">
                    sing up
                </button>
                <small id="success-signup"></small>
            </form>
            <div class=" text-center show py-2.5 px-2.5 bg-mist-200  rounded-2xl ">
                <p class="capitalize inline rounded-xl  text-center">Already have Account /</p>
                <button
                    class=" font-bold text-center cursor-pointer hover:text-blue-600 hover:underline capitalize inline"
                    id="sing-in">
                    Sign in
                </button>
            </div>
            <!----------------------------------------- -->
        </div>
        <div class="img-lefthand  xl:py-10 relative top-10   w-1/2  h-[80%]   bg-[url(iMG/img1.jpg)]  bg-center bg-cover bg-no-repeat  rounded-tl-4xl  rounded-bl-4xl  ">
            <!-- image on right part  -->
        </div>
    </div>
</body>
